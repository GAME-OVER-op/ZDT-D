plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.plugin.compose'
}


def keystorePropsFile = file('../keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
  keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def defaultStoreFile = file('../.tools/signing/debug.keystore')
def defaultStorePassword = 'android'
def defaultKeyAlias = 'androiddebugkey'
def defaultKeyPassword = 'android'

def rootModuleProp = file('../../module.prop')
def moduleProps = new Properties()
if (!rootModuleProp.exists()) {
  throw new GradleException("Root module.prop not found: ${rootModuleProp}")
}
rootModuleProp.withInputStream { moduleProps.load(it) }

def moduleVersionCode = (moduleProps.getProperty('versionCode') ?: '1').trim().toInteger()
def moduleVersionName = (moduleProps.getProperty('version') ?: '1.0').trim()
def generatedRootAssetsDir = file("$buildDir/generated/zdt-root-assets/main")
def generatedBundledAssetsDir = file("$buildDir/generated/zdt-bundled-assets/main")
def generatedNonRootJniDir = file("$buildDir/generated/zdt-nonroot-jni/main")
def zdtCompileSdk = (findProperty('zdtCompileSdk') ?: System.getenv('ZDT_COMPILE_SDK') ?: '37').toString().trim().toInteger()
def zdtCompileSdkMinor = (findProperty('zdtCompileSdkMinor') ?: System.getenv('ZDT_COMPILE_SDK_MINOR') ?: '0').toString().trim().toInteger()
def hevSocks5TunnelAar = file('libs/hev-socks5-tunnel.aar')
def zdtRequireHevAar = (findProperty('zdtRequireHevAar') ?: 'false').toString().toBoolean()
if (zdtRequireHevAar && (!hevSocks5TunnelAar.exists() || hevSocks5TunnelAar.length() == 0L)) {
  throw new GradleException("Required hev-socks5-tunnel AAR is missing: ${hevSocks5TunnelAar}")
}
def generatedModuleZip = file('../../out/module/zdt_module.zip')
def generatedModuleProp = file('../../out/module/module.prop')
def zdtModuleZip = file("$generatedBundledAssetsDir/zdt_module.zip")
def bundledModuleProp = file("$generatedRootAssetsDir/module.prop")
def legacyBusyBoxAssetsDir = new File(generatedRootAssetsDir, 'busybox')
def bundledDpiDetectorAssets = [
    file("$generatedRootAssetsDir/dpi-detector/arm64-v8a/dpi-detector"),
    file("$generatedRootAssetsDir/dpi-detector/armeabi-v7a/dpi-detector")
]
def bundledNfqwsTesterAssets = [
    file("$generatedRootAssetsDir/nfqws-tester/arm64-v8a/nfqws_tester"),
    file("$generatedRootAssetsDir/nfqws-tester/armeabi-v7a/nfqws_tester")
]
def bundledModuleSha = file("$generatedRootAssetsDir/metadata/zdt_module.sha256")
def bundledModuleCache = file("$generatedRootAssetsDir/metadata/zdt_module.cache")
def onlineModuleAssetName = 'zdt_module.zip'
def technicalAssetsBaseUrl = 'https://github.com/GAME-OVER-op/ZDT-D/releases/download/Technical_Assets'

def sha256Hex = { File source ->
  def digest = java.security.MessageDigest.getInstance('SHA-256')
  source.withInputStream { input ->
    byte[] buffer = new byte[8192]
    int read
    while ((read = input.read(buffer)) != -1) {
      digest.update(buffer, 0, read)
    }
  }
  return digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}


android {
  namespace 'com.android.zdtd.service'
  compileSdk zdtCompileSdk
  if (zdtCompileSdk >= 37) {
    // API 37 is published as a minor-versioned SDK platform (android-37.0).
    compileSdkMinor zdtCompileSdkMinor
  }

  defaultConfig {
    applicationId 'com.android.zdtd.service'
    minSdk 26
    targetSdk 36
    versionCode moduleVersionCode
    versionName moduleVersionName
  }

  flavorDimensions += 'distribution'
  productFlavors {
    bundled {
      dimension 'distribution'
      proguardFile 'src/root/proguard-rules.pro'
      buildConfigField 'String', 'DISTRIBUTION_MODE', '"bundled"'
      buildConfigField 'boolean', 'IS_ROOT_BUILD', 'true'
      buildConfigField 'boolean', 'IS_NON_ROOT_BUILD', 'false'
      buildConfigField 'boolean', 'USES_ONLINE_MODULE', 'false'
      manifestPlaceholders = [zdtDistribution: 'bundled']
    }
    online {
      dimension 'distribution'
      proguardFile 'src/root/proguard-rules.pro'
      buildConfigField 'String', 'DISTRIBUTION_MODE', '"online"'
      buildConfigField 'boolean', 'IS_ROOT_BUILD', 'true'
      buildConfigField 'boolean', 'IS_NON_ROOT_BUILD', 'false'
      buildConfigField 'boolean', 'USES_ONLINE_MODULE', 'true'
      manifestPlaceholders = [zdtDistribution: 'online']
    }
    nonroot {
      dimension 'distribution'
      proguardFile 'src/nonroot/proguard-rules.pro'
      buildConfigField 'String', 'DISTRIBUTION_MODE', '"nonroot"'
      buildConfigField 'boolean', 'IS_ROOT_BUILD', 'false'
      buildConfigField 'boolean', 'IS_NON_ROOT_BUILD', 'true'
      buildConfigField 'boolean', 'USES_ONLINE_MODULE', 'false'
      manifestPlaceholders = [zdtDistribution: 'nonroot']
    }
  }

  signingConfigs {
    zdt {
      def resolvedStoreFile = keystoreProps.getProperty('storeFile') ?: defaultStoreFile.absolutePath
      storeFile file(resolvedStoreFile)
      storePassword keystoreProps.getProperty('storePassword') ?: defaultStorePassword
      keyAlias keystoreProps.getProperty('keyAlias') ?: defaultKeyAlias
      keyPassword keystoreProps.getProperty('keyPassword') ?: defaultKeyPassword
      enableV1Signing true
      enableV2Signing true
      enableV3Signing true
    }
  }

  buildTypes {
    debug {
      // Debug is intentionally optimized too, so debug APK size and runtime behavior
      // stay close to release while keeping debuggable=true.
      minifyEnabled true
      shrinkResources true
      signingConfig signingConfigs.zdt
      debuggable true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    release {
      minifyEnabled true
      shrinkResources true
      signingConfig signingConfigs.zdt
      debuggable false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildFeatures {
    // Some environments disable BuildConfig generation via global defaults.
    // We rely on BuildConfig.VERSION_CODE/NAME and APPLICATION_ID, so force-enable it.
    buildConfig true
    viewBinding false
    compose true
    aidl true
  }

  sourceSets {
    // Never read assets from src/main/assets. Old repositories may still have
    // the pre-flavor nonroot/ca.bundle or xposed_init there after extracting an
    // update over the existing tree, because ZIP extraction does not delete
    // obsolete files. Shared assets live in src/common/assets instead.
    main {
      assets.setSrcDirs(['src/common/assets'])
    }
    bundled {
      manifest.srcFile 'src/root/AndroidManifest.xml'
      assets.setSrcDirs(['src/root/assets', generatedRootAssetsDir, generatedBundledAssetsDir])
    }
    online {
      manifest.srcFile 'src/root/AndroidManifest.xml'
      assets.setSrcDirs(['src/root/assets', generatedRootAssetsDir])
    }
    nonroot {
      assets.setSrcDirs(['src/nonroot/assets'])
      jniLibs.srcDirs += generatedNonRootJniDir
    }
  }

  packaging {
    jniLibs {
      // Non-root helper executables are packaged under lib/<abi> so Android extracts
      // them into the app-owned nativeLibraryDir, where ProcessBuilder can execute them.
      useLegacyPackaging = true
      keepDebugSymbols += ['**/libzdt_t2s.so', '**/libzdt_operaproxy.so', '**/libzdt_byedpi.so']
    }
  }
}

// Prepare generated assets used by the APK installer.
// The previous implementation used two independent preBuild tasks that could touch
// the same generated zdt_module.zip in parallel. On GitHub Actions this sometimes
// failed inside Ant copy with a cryptic "1 >= 1" error. Keep all writes to the
// generated assets directory inside one task and use java.nio copy operations.
tasks.register('prepareZdtRootAssets') {
  inputs.file(rootModuleProp).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(generatedModuleZip).optional().withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(generatedModuleProp).optional().withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.file(zdtModuleZip)
  outputs.file(bundledModuleProp)
  outputs.file(bundledModuleSha)
  outputs.file(bundledModuleCache)
  outputs.upToDateWhen { !legacyBusyBoxAssetsDir.exists() }

  doLast {
    generatedRootAssetsDir.mkdirs()
    generatedBundledAssetsDir.mkdirs()
    // Remove assets produced by older builds so BusyBox cannot leak into an APK
    // through a reused Gradle build directory.
    if (legacyBusyBoxAssetsDir.exists() && !legacyBusyBoxAssetsDir.deleteDir()) {
      throw new GradleException("Unable to remove legacy BusyBox assets: ${legacyBusyBoxAssetsDir}")
    }

    if (generatedModuleZip.exists()) {
      if (generatedModuleZip.canonicalPath != zdtModuleZip.canonicalPath) {
        java.nio.file.Files.copy(
            generatedModuleZip.toPath(),
            zdtModuleZip.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
      }
      println("[ZDT-D] synced generated module zip: ${generatedModuleZip}")
    } else if (!zdtModuleZip.exists()) {
      def fos = new FileOutputStream(zdtModuleZip)
      def zos = new java.util.zip.ZipOutputStream(fos)
      try {
        def entry = new java.util.zip.ZipEntry('PLACEHOLDER.txt')
        zos.putNextEntry(entry)
        zos.write('Replace this file with the real ZDT-D Magisk module zip.'.getBytes('UTF-8'))
        zos.closeEntry()
      } finally {
        zos.close()
        fos.close()
      }
      println("[ZDT-D] created placeholder module zip: ${zdtModuleZip}")
    }

    if (generatedModuleProp.exists()) {
      java.nio.file.Files.copy(
          generatedModuleProp.toPath(),
          bundledModuleProp.toPath(),
          java.nio.file.StandardCopyOption.REPLACE_EXISTING
      )
      println("[ZDT-D] synced generated build module.prop: ${generatedModuleProp}")
    } else {
      java.nio.file.Files.copy(
          rootModuleProp.toPath(),
          bundledModuleProp.toPath(),
          java.nio.file.StandardCopyOption.REPLACE_EXISTING
      )
      println("[ZDT-D] synced module.prop from root: ${rootModuleProp}")
    }

    bundledModuleSha.parentFile.mkdirs()
    def moduleSha = sha256Hex(zdtModuleZip)
    bundledModuleSha.text = "${moduleSha}  zdt_module.zip\n"
    bundledModuleCache.text = """name=zdt_module.zip
sha256=${moduleSha}
size=${zdtModuleZip.length()}
moduleVersion=${moduleVersionName}
moduleVersionCode=${moduleVersionCode}
protection=fake-central-directory-encrypt
onlineAsset=${onlineModuleAssetName}
onlineUrl=${technicalAssetsBaseUrl}/${onlineModuleAssetName}
"""
    println("[ZDT-D] wrote module cache metadata: ${bundledModuleCache}")
  }
}

// Compatibility task names for manual Gradle usage. They only depend on the
// single writer task above and do not touch generated files themselves.
tasks.register('syncGeneratedModuleAssets') {
  dependsOn('prepareZdtRootAssets')
}

tasks.register('ensureZdtModuleZip') {
  dependsOn('prepareZdtRootAssets')
}

tasks.register('verifyBundledHelperAssets') {
  dependsOn('prepareZdtRootAssets')

  bundledDpiDetectorAssets.each { inputs.file(it).withPathSensitivity(PathSensitivity.RELATIVE) }
  bundledNfqwsTesterAssets.each { inputs.file(it).withPathSensitivity(PathSensitivity.RELATIVE) }
  inputs.file(bundledModuleSha).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file(bundledModuleCache).withPathSensitivity(PathSensitivity.RELATIVE)

  doLast {
    bundledDpiDetectorAssets.each {
      if (!it.exists()) throw new GradleException("Bundled dpi-detector asset is missing: ${it}")
    }
    bundledNfqwsTesterAssets.each {
      if (!it.exists()) throw new GradleException("Bundled nfqws_tester asset is missing: ${it}")
    }
    if (!bundledModuleSha.exists()) {
      throw new GradleException("Bundled module SHA-256 asset is missing: ${bundledModuleSha}")
    }
    if (!bundledModuleCache.exists()) {
      throw new GradleException("Bundled module cache asset is missing: ${bundledModuleCache}")
    }
  }
}

// Root distributions need module metadata and installer helpers. The non-root
// distribution deliberately has no dependency on the module archive.
tasks.configureEach { task ->
  if (task.name in ['preBundledDebugBuild', 'preBundledReleaseBuild', 'preOnlineDebugBuild', 'preOnlineReleaseBuild']) {
    task.dependsOn('verifyBundledHelperAssets')
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.19.1'
  implementation 'androidx.appcompat:appcompat:1.8.0'
  implementation 'androidx.activity:activity-compose:1.13.0'

  // Compose
  implementation platform('androidx.compose:compose-bom:2026.09.00')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.foundation:foundation'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.animation:animation'
  implementation 'androidx.compose.material:material-icons-extended'

  // Lifecycle / coroutines helpers
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'

  // Non-root VPN bridge. Root-only distributions must not package this AAR.
  if (hevSocks5TunnelAar.exists()) {
    compileOnly files(hevSocks5TunnelAar)
    nonrootImplementation files(hevSocks5TunnelAar)
  }

  // Networking
  implementation 'com.squareup.okhttp3:okhttp:5.5.0'
  implementation 'com.github.mwiede:jsch:2.28.7'
  implementation 'org.connectbot:termlib:0.3.9'
  implementation 'org.bouncycastle:bcprov-jdk18on:1.86'

  // Remote setup

  // Offline MMDB reader for bundled DB-IP Lite City geolocation database
  implementation 'com.maxmind.db:maxmind-db:4.1.0'

  // Root shell helper (Magisk author)
  implementation 'com.github.topjohnwu.libsu:core:6.0.0'

  // LSPosed/Xposed API is provided by the framework at runtime.
  compileOnly 'de.robv.android.xposed:api:82'

  debugImplementation 'androidx.compose.ui:ui-tooling'
}
