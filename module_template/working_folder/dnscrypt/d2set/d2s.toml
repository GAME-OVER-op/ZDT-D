# D2S reads its listener address from the active `proxy` entry in
# dnscrypt-proxy.toml. The listener is not configured in this file.

# Local passwordless SOCKS5 servers. Empty means DIRECT fallback only.
backends = []
direct_fallback = true

connect_timeout_ms = 500
upstream_handshake_timeout_ms = 1000
backend_attempt_timeout_ms = 1200
direct_connect_timeout_ms = 2000
client_handshake_timeout_ms = 3000
probe_timeout_ms = 1200

healthy_probe_interval_secs = 30
recovery_probe_interval_secs = 5
# Runtime hard-failure hysteresis baseline. Target/path errors do not directly
# decide health; they trigger a strict Full probe. Soft timeout hysteresis is
# automatically wider (T2S-style).
failure_threshold = 3
runtime_cooldown_ms = 2000

# Stop synthetic health probes after this many seconds without client traffic.
# New DNSCrypt activity wakes health checks immediately. Set to 0 to disable.
idle_after_secs = 60

# Full Internet health probes. Targets are tried in order until one proves
# TCP -> SOCKS greeting -> CONNECT -> TLS ClientHello -> real response.
# Do not put a native DNSCrypt-only endpoint here.
probe_targets = [
  "1.1.1.1:443",
  "8.8.8.8:443",
]

max_connections = 1024
tcp_nodelay = true
log_level = "info"
shutdown_grace_period_ms = 5000
