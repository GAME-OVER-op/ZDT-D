# qwdtt-cli configuration — EXAMPLE. Copy to a gitignored location and fill in.
#
#   cp qwdtt.example.conf /data/adb/ZDT-D/etc/qwdtt.conf   (then chmod 600)
#
# This file holds secrets in production (VK call hashes, the plaintext tunnel
# password, the VPS host). NEVER commit a filled-in copy. Only this example,
# with placeholder values, belongs in the repo.
#
# Format: one `key = value` per line. A line whose first non-space character is
# `#` or `;` is a comment. Inline comments after a value are NOT supported: the
# rest of the line is taken literally as the value (so a `#` can appear in a
# password). Put any comment on its own line above the setting.

# --- Paths -------------------------------------------------------------------

# The built upstream go_client transport binary (arm64-v8a on device). When
# deploying via the ZDT-D app's per-profile bin/ uploader, point this at the
# profile bin dir (same place qwdtt-cli and this config are uploaded).
transport_binary = /data/adb/modules/ZDT-D/working_folder/myprogram/profile/qwdtt/bin/qwdtt-transport

# Persistent working directory. The transport is chdir'd here and writes all of
# its CWD-relative artifacts into it: wg-turn.conf, vk_profile.json,
# captcha_browser_fp. Must survive restarts so the browser identity stays stable.
# Kept separate from bin/ so runtime state does not mix with uploaded binaries.
state_dir = /data/adb/modules/ZDT-D/working_folder/myprogram/profile/qwdtt/state

# --- Connection --------------------------------------------------------------

# VPS DTLS endpoint, host:port. The handset never contacts this directly — the
# transport reaches it only through VK TURN relays.
peer = 203.0.113.10:56000

# Local UDP endpoint the WireGuard client dials. Must be loopback.
listen = 127.0.0.1:9000

# VK call join hashes. Comma/space/semicolon separated. Dead ones are dropped at
# startup by validation; keep several so one dead room does not kill the session.
vk_hashes = REPLACE_HASH_1, REPLACE_HASH_2, REPLACE_HASH_3, REPLACE_HASH_4

# Plaintext tunnel password. The transport derives its WRAP key from this via
# HKDF. The app's `connection_password_encrypted` keystore blob CANNOT be reused
# — supply the plaintext here. Rotate before production use.
password = REPLACE_TUNNEL_PASSWORD

# Total worker count. Floored to a multiple of 9 and capped at 108 by the
# transport. 45 = 5 groups of 9 (matches the reference device).
workers = 45

# RTP obfuscation mode: audio | video. The reference device uses video.
obfs = video

# --- VK auth / DNS / captcha -------------------------------------------------

# anonymous | account
vk_auth = anonymous

# vkcalls | legacy
vk_anon_path = vkcalls

# preset name, custom:IP, or doh:URL — used to reach VK
go_dns = yandex

# auto | rjs  (wv/WebView is rejected: no headless WebView)
captcha_mode = auto

# Stable 8-byte hex device identity (the app generates one per device).
device_id = 0000000000000000

# --- Logging -----------------------------------------------------------------

# Fixed UTC offset for log timestamps: UTC+3 | +03:00 | -0530 | UTC (default).
# Android ships no zoneinfo, so without this every timestamp is logged in UTC.
# This is a fixed offset with no DST transitions — if your zone observes DST,
# update it when the clocks change. IANA names (Europe/Kyiv) are NOT supported;
# they would require embedding the whole timezone database in the binary.
timezone = UTC+3

# --- Optional: identity seeds ------------------------------------------------
# If set and the state_dir copy is absent, these are copied in so the transport
# starts from a known browser identity instead of generating a fresh one.
# seed_profile = /data/adb/ZDT-D/etc/vk_profile.json
# seed_captcha_fp = /data/adb/ZDT-D/etc/captcha_browser_fp

# --- Optional: manual captcha token feed -------------------------------------
# A watched file. Append a solved captcha token as a line and the supervisor
# forwards it to the transport as CAPTCHA_RESULT|<token>. This is the headless
# fallback when the Go v2 solver cannot pass a challenge.
# captcha_token_file = /data/adb/ZDT-D/qwdtt/captcha_token

# --- Client mode -------------------------------------------------------------
# vpn   (default) transport listens on `listen`; qwdtt-cli brings up the TUN
#       below and ZDT-D routes apps to it via a myvpn profile. This is the path
#       verified end-to-end on-device.
# socks transport keeps WireGuard in its own userspace netstack and serves SOCKS5
#       on socks_addr — no TUN, no amneziawg-go, no awg. Route apps with ZDT-D's
#       myproxy instead of myvpn. Needs a transport built from our current pin.
#
# WARNING: SOCKS is TCP CONNECT only. App UDP traffic (QUIC, direct DNS) is NOT
# carried and goes direct — which a whitelist ISP drops. Treat socks as
# experimental until you have tested it on your SIM.
mode = vpn

# Local SOCKS5 listen address (mode = socks only). Must be loopback.
socks_addr = 127.0.0.1:1080

# --- WireGuard interface (M2; mode = vpn only) --------------------------------
# After wg-turn.conf is written, the supervisor spawns amneziawg-go, applies the
# config with awg, and brings up the TUN with `ip`. It installs no routes and
# binds no UIDs — routing is ZDT-D's job (myvpn/netd). The interface is created
# by root, so it carries no Android VPN UI.

# set false to run the transport alone
wg_bringup = true

# interface name amneziawg-go creates
tun = zdtdqw0

# Override the MTU the transport emits in wg-turn.conf (1280). 0 = keep the
# emitted value. 1280 is confirmed good under sustained load; lower it toward
# 1200 only if fragmentation appears (WireGuard in RTP in DTLS in a TURN relay
# is a deep stack). Valid range when set: 576..9000.
mtu = 0

awg_go_binary = /data/adb/modules/ZDT-D/bin/amneziawg-go
awg_binary = /data/adb/modules/ZDT-D/bin/awg

# amneziawg-go working dir. Default matches the ZDT-D-built binaries' patched
# UAPI socket path (amneziawg-go uses CWD-relative run/amneziawg; awg's
# RUNSTATEDIR is this dir). Only override if you ship your own awg build.
# awg_run_dir = /data/adb/modules/ZDT-D/working_folder/amneziawg

# wait for the TUN link to appear
link_wait = 15s

# wait for the TUN to carry its address
tun_ready_wait = 25s

# --- Supervision -------------------------------------------------------------

# time to wait for wg-turn.conf after a (re)start
startup_deadline = 90s

# 0 = unlimited; otherwise exit non-zero after this many
max_restarts = 10

# base delay between restart attempts
restart_backoff = 5s

# Minimum steady-state active workers before forcing a restart. The patched
# transport (upstream/qwdtt) emits the STATS| marker the watchdog reads, so this
# can be enabled. 0 disables it. A conservative floor is one worker group (9);
# raise it toward `workers` once you have field data on steady-state counts.
watchdog_min_active = 0
