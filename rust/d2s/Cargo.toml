[package]
name = "d2s"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "DNS-to-SOCKS transport balancer with automatic failover and direct fallback"
license = "MIT"
publish = false
keywords = ["dnscrypt", "socks5", "failover", "proxy", "android"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "d2s"
path = "src/lib.rs"

[[bin]]
name = "d2s"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
